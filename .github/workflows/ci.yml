name: CI (Validación de PR)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: saas_secure_password
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        env:
          DATABASE_URL: postgresql://saas_admin:saas_secure_password@localhost:5432/saas_test?schema=public
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Verificar Linting
        run: npm run lint --workspaces --if-present

      - name: Ejecutar Test Unitarios e Integración
        env:
          DATABASE_URL: postgresql://saas_admin:saas_secure_password@localhost:5432/saas_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super_secure_ci_test_jwt_secret_key_123456
        run: npm test --workspaces --if-present
